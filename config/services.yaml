# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        # Not consumed by any authenticator yet (no login flow exists), so the
        # compiler prunes it as unreachable unless kept reachable via a public alias.
        Symfony\Component\PasswordHasher\Hasher\UserPasswordHasherInterface:
            alias: security.user_password_hasher
            public: true

        # This project has no monolog-bundle, so Symfony's fallback PSR-3 logger
        # (Symfony\Component\HttpKernel\Log\Logger) is active. It writes to stderr,
        # and HttpKernel's ErrorListener logs every uncaught 4xx HttpException at
        # ERROR level -- which pollutes `phpunit` output with lines from
        # negative-path controller tests that deliberately provoke (and assert) a
        # 4xx response. Raising the floor to CRITICAL drops that 4xx noise while
        # still surfacing what actually matters in a test run: non-HTTP throwables
        # and any status >= 500 are logged at CRITICAL by ErrorListener. Defining
        # `logger` here makes HttpKernel's LoggerPass skip its own registration, so
        # the remaining constructor arguments are restated verbatim.
        logger:
            class: Symfony\Component\HttpKernel\Log\Logger
            arguments:
                - 'critical'            # $minLevel: only CRITICAL+ reaches stderr during tests
                - ~                     # $output: default (stderr)
                - ~                     # $formatter: default
                - '@request_stack'      # $requestStack
                - '%kernel.debug%'      # $debug

when@e2e:
    services:
        # Browser E2E test-support (seed command + POST /__e2e__/reset endpoint).
        # Lives under tests/, so it is only autoloaded when dev deps are installed
        # and only wired here — never present in dev/prod.
        App\Tests\Support\E2e\:
            resource: '../tests/Support/E2e/'
            autowire: true
            autoconfigure: true
