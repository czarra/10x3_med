services:
  database-test:
    container_name: psql_test_med
    image: postgres:18
    environment:
      POSTGRES_USER: ${DOCKER_POSTGRES_USER_TEST}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD_TEST}
      POSTGRES_DB: ${DOCKER_POSTGRES_DB_TEST}
      PGDATA: /var/lib/postgresql/med
    ports:
      - '4307:5432'
    volumes:
      - ./postgres_test_data:/var/lib/postgresql/med
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DOCKER_POSTGRES_USER_TEST} -d ${DOCKER_POSTGRES_DB_TEST}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  database:
    container_name: psql_med
    image: postgres:18
    environment:
      POSTGRES_USER: ${DOCKER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DOCKER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DOCKER_POSTGRES_DB}
      PGDATA: /var/lib/postgresql/med
    ports:
      - '4306:5432'
    volumes:
      - ./postgres_data:/var/lib/postgresql/med
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DOCKER_POSTGRES_USER} -d ${DOCKER_POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  php:
    container_name: php8_med
    build:
      context: .
      dockerfile: php/Dockerfile
      target: dev
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - '8381:80'
    volumes:
      - .:/var/www/med
    depends_on:
      database:
        condition: service_healthy
      database-test:
        condition: service_healthy

  # App instance the browser E2E suite drives. Same image as `php`, but served in
  # a real APP_ENV=e2e environment (see .env.e2e). Reuses the `database-test`
  # Postgres — the E2E fixtures only touch `@e2e.test` rows.
  php-e2e:
    container_name: php_e2e_med
    build:
      context: .
      dockerfile: php/Dockerfile
      target: dev
    environment:
      APP_ENV: e2e
      APP_DEBUG: '0'
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - '8382:80'
    volumes:
      - .:/var/www/med
    depends_on:
      database-test:
        condition: service_healthy
    # var/ is bind-mounted from the host (uid 1000); Apache runs as www-data.
    # Create + hand over just the e2e cache/log dirs, then start Apache.
    command: >
      sh -c "mkdir -p var/cache/e2e var/log
      && chown -R www-data:www-data var/cache/e2e var/log
      && exec apache2-foreground"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost/login > /dev/null || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 15

  # Playwright runner. Stays up (sleep infinity) so E2E is invoked the same way
  # as PHPUnit:  docker compose exec playwright npx playwright test
  # In CI, run one-shot:  docker compose run --rm playwright npx playwright test
  playwright:
    container_name: playwright_med
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    working_dir: /var/www/med
    # Same explicit resolvers as php / php-e2e: without them `npm ci` can hang
    # forever on registry.npmjs.org when the CI runner's embedded Docker DNS
    # black-holes external lookups.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ipc: host
    environment:
      PLAYWRIGHT_BASE_URL: http://php-e2e
      CI: ${CI:-}
    volumes:
      - .:/var/www/med
    depends_on:
      php-e2e:
        condition: service_healthy
    command: sleep infinity
