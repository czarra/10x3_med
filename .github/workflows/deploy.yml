name: Deploy

on:
  # Automatic path: only after the CI workflow finishes on main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual path: on-demand redeploy of main without a new commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialise deploys to the prod service — don't cancel one already running
    # (a superseded release still finishing is harmless; a cancelled one mid-push
    # is not).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # workflow_dispatch: always (operator's call). workflow_run: only if CI was green.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: railway up --service "$RAILWAY_SERVICE" --environment production --detach
